[project]
name = "voice-agent"
version = "0.1.0"
description = "Cascaded voice agent: Silero VAD + Smart Turn -> STT -> LLM -> TTS, with barge-in"
requires-python = ">=3.10"
dependencies = [
    "pipecat-ai[webrtc,silero,openai,runner]==1.13.0",
    "pydantic>=2",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["voice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
